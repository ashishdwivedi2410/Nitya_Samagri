# redis/redis.conf
#
# NEW: the original app never had a standalone Redis config file — it
# configured Redis entirely via inline `command:` flags in
# docker-compose.dev.yml and docker-compose.prod.yml:
#
#   redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb
#                 --maxmemory-policy allkeys-lru --appendonly yes
#
# This file centralizes that config so it's versioned and easy to extend,
# and can be mounted into the container instead of passed as CLI flags:
#
#   volumes:
#     - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
#   command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
#
# (requirepass is deliberately still passed via env at runtime rather than
# hardcoded here, so the password never ends up committed to the repo.)

# ── Persistence ─────────────────────────────────────────────────────────────
appendonly yes
appendfsync everysec
appendfilename "nityasamagri.aof"

save 900 1
save 300 10
save 60 10000

# ── Memory ──────────────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Networking ──────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# ── Logging ─────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Snapshots ───────────────────────────────────────────────────────────────
dbfilename dump.rdb
dir /data

# ── Slow log (useful for catching runaway cache keys) ─────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128