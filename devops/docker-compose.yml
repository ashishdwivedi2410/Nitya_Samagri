# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — nityasamagri full stack local development
# Run: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  nityasamagri:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nginx_logs:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nityasamagri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nityasamagri
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nityasamagri_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - nityasamagri
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nityasamagri"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nityasamagri_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nityasamagri_redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nityasamagri
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nityasamagri_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local media storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nityasamagri_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-nityasamagri}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nityasamagri_minio}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - nityasamagri
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nityasamagri_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-nityasamagri_dev}@postgres:5432/nityasamagri
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nityasamagri_redis}
      NODE_ENV:     development
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
    ports:
      - "4000:4000"
    networks:
      - nityasamagri
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # ── Customer Web (Next.js) ──────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: nityasamagri_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:     http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL:      ws://localhost:4000/ws
      NEXT_PUBLIC_RAZORPAY_KEY: ${RAZORPAY_KEY_ID}
    volumes:
      - ./apps/web:/app:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - nityasamagri
    depends_on:
      - api

  # ── Admin Panel (Next.js) ───────────────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: development
    container_name: nityasamagri_admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL:  ws://localhost:4000/ws
    volumes:
      - ./apps/admin:/app:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    networks:
      - nityasamagri
    depends_on:
      - api

  # ── Pandit Panel (Next.js) ──────────────────────────────────────────────────
  pandit:
    build:
      context: ./apps/pandit
      dockerfile: Dockerfile
      target: development
    container_name: nityasamagri_pandit
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL:  ws://localhost:4000/ws
    volumes:
      - ./apps/pandit:/app:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    networks:
      - nityasamagri
    depends_on:
      - api

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nityasamagri_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
    networks:
      - nityasamagri
    depends_on:
      - web
      - api

  # ── pgAdmin (DB GUI) ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nityasamagri_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@nityasamagri.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - nityasamagri
    depends_on:
      - postgres
    profiles:
      - tools

