# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — nityasamagri full stack local development
# Run: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  nityasamagri:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  minio_data:
  nginx_logs:

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: nityasamagri_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nityasamagri}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-nityasamagri_dev}
      MONGO_INITDB_DATABASE:      nityasamagri
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - nityasamagri
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nityasamagri_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nityasamagri_redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nityasamagri
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nityasamagri_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local media storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nityasamagri_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-nityasamagri}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nityasamagri_minio}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - nityasamagri
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      # backend/Dockerfile COPYs the root package-lock.json (npm workspaces),
      # so context must be the repo root, not backend/ — same as the
      # GitHub Actions build step (context: ., file: ./backend/Dockerfile).
      context: ../../
      dockerfile: backend/Dockerfile
      target: development
    container_name: nityasamagri_api
    restart: unless-stopped
    # Relative paths in a merged `docker compose -f a -f b` run resolve
    # against the *first* file's directory — this file lives at
    # devops/docker/, so reaching the real <repo root>/backend/.env needs
    # two levels up, not one (same fix applied to api_blue/api_green's
    # env_file in docker-compose.prod.yml).
    env_file: ../../backend/.env
    environment:
      MONGO_URI:    mongodb://${MONGO_ROOT_USER:-nityasamagri}:${MONGO_ROOT_PASSWORD:-nityasamagri_dev}@mongodb:27017/nityasamagri?authSource=admin
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nityasamagri_redis}
      NODE_ENV:     development
    volumes:
      - ../../backend/src:/app/src:ro
    ports:
      - "4000:4000"
    networks:
      - nityasamagri
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # ── Customer Web (Next.js) ──────────────────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: nityasamagri_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:     http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL:      ws://localhost:4000/ws
      NEXT_PUBLIC_RAZORPAY_KEY: ${RAZORPAY_KEY_ID}
    volumes:
      - ../../apps/web:/app:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - nityasamagri
    depends_on:
      - api

  # ── Admin Panel (Next.js) ───────────────────────────────────────────────────
  admin:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
      target: development
    container_name: nityasamagri_admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL:  ws://localhost:4000/ws
    volumes:
      - ../../apps/admin:/app:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    networks:
      - nityasamagri
    depends_on:
      - api

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nityasamagri_nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/sites:/etc/nginx/sites:ro
      - ../nginx/active:/etc/nginx/active:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
    networks:
      - nityasamagri
    depends_on:
      - web
      - api

  # ── Mongo Express (DB GUI) ──────────────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: nityasamagri_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-nityasamagri}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-nityasamagri_dev}
      ME_CONFIG_MONGODB_SERVER:        mongodb
      ME_CONFIG_BASICAUTH_USERNAME:    admin
      ME_CONFIG_BASICAUTH_PASSWORD:    ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:8081"
    networks:
      - nityasamagri
    depends_on:
      - mongodb
    profiles:
      - tools