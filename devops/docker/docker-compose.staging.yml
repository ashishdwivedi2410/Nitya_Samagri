# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.staging.yml — Staging overrides
#
# NEW: no staging compose file existed in the original app (only dev and a
# blue/green prod). This is a deliberately simpler single-instance version
# of docker-compose.prod.yml's api/web/admin/chatbot services — staging
# doesn't need blue/green zero-downtime deploys, just a stable, isolated
# environment that mirrors prod's build targets and env shape.
#
# Run: docker compose -f docker-compose.dev.yml -f docker-compose.staging.yml <cmd>
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  api:
    build:
      # backend/Dockerfile COPYs the root package-lock.json (npm workspaces),
      # so context must be the repo root, not backend/.
      context: ../../
      dockerfile: backend/Dockerfile
      target: production
    env_file: ../../backend/.env.staging
    environment:
      NODE_ENV: staging
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-nityasamagri}:${MONGO_ROOT_PASSWORD:-nityasamagri_staging}@mongodb:27017/nityasamagri_staging?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: unless-stopped

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: https://staging-api.nityasamagri.in
    restart: unless-stopped

  admin:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
      target: production
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: https://staging-api.nityasamagri.in
    restart: unless-stopped

  # NEW: chatbot didn't exist in the original app, and as of this snapshot
  # there's no chatbot/ directory, Dockerfile, or app code anywhere in this
  # repo — this service will fail to build until that code exists somewhere.
  # Left commented out rather than pointing at a path that can't work yet;
  # uncomment and fix the context once nitya-samagri-chatbot has real code
  # checked out (either as a repo-root sibling of backend/apps, or update
  # the path to wherever it actually lives).
  # chatbot:
  #   build:
  #     context: ../../chatbot
  #     dockerfile: Dockerfile
  #   env_file: ../../chatbot/.env.staging
  #   environment:
  #     NODE_ENV: staging
  #   restart: unless-stopped

  mongodb:
    environment:
      MONGO_INITDB_DATABASE: nityasamagri_staging
    restart: unless-stopped

  redis:
    restart: unless-stopped