# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf — Production Nginx: core config, includes per-site configs
# Migrated from Nitya_Samagri-main/devops/nginx/nginx.prod.conf
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time"';

  access_log /var/log/nginx/access.log main;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length    1000;

  # ── Security headers ───────────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"  always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header X-Content-Type-Options    "nosniff"     always;
  add_header Referrer-Policy           "no-referrer-when-downgrade" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  server_tokens off;

  # ── Rate limiting zones (shared across all sites) ─────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;
  limit_req_zone $binary_remote_addr zone=general:10m  rate=60r/m;
  limit_req_zone $binary_remote_addr zone=chatbot:10m  rate=20r/m;

  # ── Blue/green backend pointers ────────────────────────────────────────────
  # api_backend / web_backend / admin_backend are declared as variables (not
  # static `upstream` blocks) so the color can be flipped by overwriting
  # nginx/active/{svc}-backend.conf and reloading — see nginx/active/README.md
  # and scripts/switch-color.sh. A variable target isn't resolved at config
  # load time like a static upstream is, so it needs a resolver to look the
  # container name up at request time — Docker Compose's embedded DNS lives
  # at 127.0.0.11 on the bridge network.
  #
  # NOTE: each active/{svc}-backend.conf is just a bare `set $x_backend ...;`
  # line, and `set` is only valid inside `server`/`location`/`if` — never
  # directly inside `http`. So each include lives at the top of its matching
  # server block (sites/backend.conf, sites/frontend.conf, sites/admin.conf)
  # instead of here; nginx still makes the variable visible to every
  # `location` nested inside that server. Putting all three here used to
  # make nginx fail config load entirely with "set directive is not allowed
  # here", crash-looping the container.
  resolver 127.0.0.11 valid=10s;

  # NOTE: chatbot service did not exist in the original app and has no
  # blue/green pair yet (see nginx/active/README.md). This assumes the new
  # nitya-samagri-chatbot service is deployed as `chatbot` on port 5000 —
  # adjust to match your actual deploy target.
  #
  # As of this snapshot there's no chatbot app code, Dockerfile, or compose
  # service in this repo yet, so sites/chatbot.conf won't have anything to
  # reach until that's built. This MUST stay a variable (resolved lazily via
  # the `resolver` above, per-request), not a static `upstream {}` block —
  # a static upstream needs to resolve its host at config-load time, and
  # since `chatbot` doesn't exist in docker-compose.prod.yml, that resolution
  # would fail and nginx would refuse to start entirely, taking the
  # storefront/admin/API down too over a service that was never deployed.
  # Once the real chatbot container exists, this can switch back to a
  # static upstream if desired. The `set $chatbot_backend ...;` itself lives
  # in sites/chatbot.conf's server block — same reasoning as api/web/admin
  # above: `set` isn't valid directly inside `http`.

  # ── HTTP → HTTPS redirect (all domains) ────────────────────────────────────
  server {
    listen 80;
    server_name nityasamagri.in www.nityasamagri.in adminns.in api.adminns.in chat.nityasamagri.in;
    return 301 https://$host$request_uri;
  }

  # ── Per-site server blocks ─────────────────────────────────────────────────
  include /etc/nginx/sites/frontend.conf;
  include /etc/nginx/sites/admin.conf;
  include /etc/nginx/sites/backend.conf;
  include /etc/nginx/sites/chatbot.conf;
}