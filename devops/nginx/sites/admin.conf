# ── Admin panel — adminns.in ────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name adminns.in;

  ssl_certificate     /etc/letsencrypt/live/adminns.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adminns.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Restrict to office IPs (add your IPs below)
  # allow 203.0.113.0/24;
  # deny all;

  location / {
    proxy_pass http://$admin_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}