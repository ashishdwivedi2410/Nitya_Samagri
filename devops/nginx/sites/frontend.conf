# ── Customer storefront — nityasamagri.in ──────────────────────────────────
server {
  listen 443 ssl http2;
  server_name nityasamagri.in www.nityasamagri.in;

  ssl_certificate     /etc/letsencrypt/live/nityasamagri.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nityasamagri.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;

  client_max_body_size 10M;

  # Static assets — long cache
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
    proxy_pass http://$web_backend;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Next.js app
  location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://$web_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 60s;
  }
}