# ── Chatbot API — chat.nityasamagri.in ─────────────────────────────────────
# NEW: scaffolded for the nitya-samagri-chatbot service. There is no
# equivalent in the original app, so double-check the domain, upstream
# name/port and SSL cert path against however you actually deploy it.
server {
  listen 443 ssl http2;
  server_name chat.nityasamagri.in;

  # $chatbot_backend as a variable (not a static upstream {}) so nginx
  # resolves it lazily per-request via the http{}-level `resolver` instead
  # of at config-load time — see the note in nginx.conf. Until the real
  # chatbot container exists, requests here 502 instead of the whole nginx
  # process refusing to start.
  set $chatbot_backend "chatbot:5000";

  ssl_certificate     /etc/letsencrypt/live/nityasamagri.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nityasamagri.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  client_max_body_size 5M;

  # Chat endpoints — rate limited to protect the AI provider's rate limits/cost
  location /api/chat {
    limit_req zone=chatbot burst=10 nodelay;
    proxy_pass http://$chatbot_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Chat responses can stream / take longer than a typical API call
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  location /health {
    proxy_pass http://$chatbot_backend;
    access_log off;
  }
}