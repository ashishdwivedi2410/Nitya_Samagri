# ── API — api.adminns.in ────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name api.adminns.in;

  ssl_certificate     /etc/letsencrypt/live/adminns.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adminns.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 20M;

  # Auth endpoints — strict rate limit
  location ~ ^/api/v1/auth/(login|register|otp) {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Razorpay webhook — no rate limit, raw body
  location /api/v1/payments/webhook {
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # WebSocket upgrade
  location /ws {
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # General API
  location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Health check
  location /health {
    proxy_pass http://$api_backend;
    access_log off;
  }
}