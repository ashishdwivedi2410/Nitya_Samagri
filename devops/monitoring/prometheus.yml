# NEW: placeholder scrape config. The backend (Express) currently has no
# /metrics endpoint — you'd need to add a Prometheus client (e.g.
# prom-client) to backend/src before these targets return anything.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:4000"]
        labels: { service: "api" }

  - job_name: "chatbot"
    static_configs:
      - targets: ["chatbot:5000"]
        labels: { service: "chatbot" }