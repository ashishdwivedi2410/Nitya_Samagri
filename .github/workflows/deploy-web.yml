name: 🌐 Deploy Customer Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"

env:
  REGISTRY:   docker.io
  IMAGE_NAME: nityasamagri/web
  NODE_VERSION: "20"

jobs:
  # ── Quality Check ────────────────────────────────────────────────────────────
  quality:
    name: 🔍 Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL:      https://api.nityasamagri.com/api/v1
          NEXT_PUBLIC_WS_URL:       wss://api.nityasamagri.com/ws
          NEXT_PUBLIC_RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY_ID }}

  # ── Build & Push Docker Image ─────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:  ./apps/web
          file:     ./apps/web/Dockerfile
          target:   production
          push:     true
          tags:     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nityasamagri.com/api/v1
            NEXT_PUBLIC_WS_URL=wss://api.nityasamagri.com/ws
            NEXT_PUBLIC_RAZORPAY_KEY=${{ secrets.RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_APP_URL=https://nityasamagri.com

  # ── Deploy to Lightsail ───────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://nityasamagri.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/nityasamagri
            git pull origin main
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           pull web
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           up -d --no-deps web
            sleep 10
            curl -sf https://nityasamagri.com || exit 1
            docker image prune -f
            echo "✅ Customer web deployed!"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          SKIP_API:                "1"
          SKIP_ADMIN:              "1"
          SMOKE_TEST_RETRIES:      "6"
          SMOKE_TEST_RETRY_DELAY:  "8"