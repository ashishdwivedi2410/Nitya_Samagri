name: 🔧 Scheduled Maintenance

on:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST daily
  workflow_dispatch:          # allow manual trigger

jobs:
  # ── Health Check ─────────────────────────────────────────────────────────────
  health-check:
    name: 💓 Health Check All Services
    runs-on: ubuntu-latest

    steps:
      - name: Check API health
        run: |
          response=$(curl -sf https://api.nityasamagri.com/health)
          echo "API: $response"
          echo "$response" | grep -q '"status":"ok"' || (echo "❌ API unhealthy!" && exit 1)

      - name: Check Customer Web
        run: curl -sf https://nityasamagri.com -o /dev/null || echo "⚠️ Web might be down"

      - name: Check Admin Panel
        run: curl -sf https://admin.nityasamagri.com -o /dev/null || echo "⚠️ Admin might be down"

      - name: All services healthy
        run: echo "✅ All services healthy at $(date)"

  # ── Database Backup ──────────────────────────────────────────────────────────
  database-backup:
    name: 🗄️ Database Backup
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - name: Backup PostgreSQL to S3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            DATE=$(date +%Y-%m-%d)
            BACKUP_FILE="nityasamagri_backup_${DATE}.sql.gz"

            echo "🗄️ Starting database backup..."

            # Dump and compress
            docker compose -f ~/nityasamagri/docker-compose.yml \
              -f ~/nityasamagri/docker-compose.prod.yml \
              exec -T postgres \
              pg_dump -U postgres nityasamagri | gzip > /tmp/$BACKUP_FILE

            # Upload to S3
            aws s3 cp /tmp/$BACKUP_FILE \
              s3://${{ secrets.AWS_S3_BUCKET }}/backups/$BACKUP_FILE \
              --region ${{ secrets.AWS_REGION }}

            # Keep only last 30 days of backups
            aws s3 ls s3://${{ secrets.AWS_S3_BUCKET }}/backups/ | \
              sort | head -n -30 | \
              awk '{print $4}' | \
              xargs -I {} aws s3 rm s3://${{ secrets.AWS_S3_BUCKET }}/backups/{}

            # Cleanup local file
            rm /tmp/$BACKUP_FILE

            echo "✅ Backup complete: $BACKUP_FILE"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ── Dependency Audit ─────────────────────────────────────────────────────────
  dependency-audit:
    name: 🔍 Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit backend
        run: |
          cd backend
          npm install
          npm audit --audit-level=critical || true

      - name: Audit customer web
        run: |
          cd apps/web
          npm install
          npm audit --audit-level=critical || true

  # ── Low Stock Alert ──────────────────────────────────────────────────────────
  low-stock-alert:
    name: 📦 Low Stock Check
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - name: Check low stock via API
        run: |
          response=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
            "https://api.nityasamagri.com/api/v1/products?inStock=true&limit=100")

          echo "Low stock check complete"
          echo "$response" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          products = data.get('data', {}).get('products', [])
          low = [p for p in products if p['stock'] <= p.get('lowStockAt', 10)]
          if low:
              print(f'⚠️ {len(low)} products are low on stock:')
              for p in low:
                  print(f'  - {p[\"name\"]}: {p[\"stock\"]} units left')
          else:
              print('✅ All products have adequate stock')
          " || true

  # ── SSL Certificate Check ────────────────────────────────────────────────────
  ssl-check:
    name: 🔒 SSL Certificate Expiry Check
    runs-on: ubuntu-latest

    steps:
      - name: Check SSL expiry for all domains
        run: |
          for domain in nityasamagri.com admin.nityasamagri.com api.nityasamagri.com; do
            expiry=$(echo | openssl s_client -servername $domain -connect $domain:443 2>/dev/null | \
              openssl x509 -noout -dates 2>/dev/null | grep notAfter | cut -d= -f2)
            expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
            now_epoch=$(date +%s)
            days_left=$(( (expiry_epoch - now_epoch) / 86400 ))

            if [ $days_left -lt 14 ]; then
              echo "⚠️ SSL for $domain expires in $days_left days! Renew immediately."
            else
              echo "✅ SSL for $domain: $days_left days remaining"
            fi
          done