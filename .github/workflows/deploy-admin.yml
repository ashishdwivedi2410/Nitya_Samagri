name: 🛠️ Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/deploy-admin.yml"

env:
  NODE_VERSION: "20"

jobs:
  # ── Build Admin Docker Image ──────────────────────────────────────────────────
  build-admin:
    name: 🐳 Build Admin Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context:  .
          file:     ./apps/admin/Dockerfile
          target:   production
          push:     true
          tags:     nityasamagri/admin:latest,nityasamagri/admin:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nityasamagri.com/api/v1
            NEXT_PUBLIC_WS_URL=wss://api.nityasamagri.com/ws
            NEXT_PUBLIC_APP_URL=https://admin.nityasamagri.com

  # ── Deploy Both to Lightsail ──────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [build-admin]
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/nityasamagri
            git pull origin main

            # Pull new images
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           pull admin

            # Restart admin
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           up -d --no-deps admin

            sleep 10

            # Health checks
            curl -sf https://admin.nityasamagri.com  || exit 1

            docker image prune -f
            echo "✅ Admin panel deployed!"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          SKIP_API:                "1"
          SKIP_WEB:                "1"
          SMOKE_TEST_RETRIES:      "6"
          SMOKE_TEST_RETRY_DELAY:  "8"

          