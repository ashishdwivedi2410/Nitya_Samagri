name: 🛠️ Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/deploy-admin.yml"

env:
  REGISTRY:     docker.io
  IMAGE_NAME:   nityasamagri/admin
  NODE_VERSION: "20"

jobs:
  # ── Build Admin Docker Image ──────────────────────────────────────────────────
  build-admin:
    name: 🐳 Build Admin Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context:  .
          file:     ./apps/admin/Dockerfile
          target:   production
          push:     true
          tags:     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nityasamagri.in/api/v1
            NEXT_PUBLIC_WS_URL=wss://api.nityasamagri.in/ws
            NEXT_PUBLIC_APP_URL=https://admin.nityasamagri.in

  # ── Deploy Both to Lightsail ──────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [build-admin]
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          envs:     NEW_TAG
          script: |
            set -e
            cd ~/Nitya_Samagri
            git pull origin main

            # Production only knows admin_blue / admin_green (see
            # docker-compose.prod.yml) — there's no bare "admin" service.
            # This workflow deploys just the admin app, so rather than doing
            # a full blue/green swap (which would also have to flip the
            # shared .active_color file that deploy-scheduled.yml uses to
            # keep api/web/admin in sync), it updates whichever color is
            # already live, in place — same pattern as deploy-web.yml.
            ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
            echo "Currently live color: $ACTIVE — updating admin_$ACTIVE in place."

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TAG
            docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TAG ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$ACTIVE

            docker compose -f devops/docker-compose.yml \
                           -f devops/docker-compose.prod.yml \
                           up -d --no-deps admin_$ACTIVE

            sleep 10

            # Health checks
            curl -sf https://admin.nityasamagri.in  || exit 1

            docker image prune -f
            echo "✅ Admin panel deployed (color: $ACTIVE)!"
        env:
          NEW_TAG: ${{ github.sha }}

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          SKIP_API:                "1"
          SKIP_WEB:                "1"
          SMOKE_TEST_RETRIES:      "6"
          SMOKE_TEST_RETRY_DELAY:  "8"
          