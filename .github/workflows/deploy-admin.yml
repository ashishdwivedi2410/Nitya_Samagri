name: 🛠️ Deploy Admin & Pandit Panels

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/pandit/**"
      - ".github/workflows/deploy-admin.yml"

env:
  NODE_VERSION: "20"

jobs:
  # ── Build Admin Docker Image ──────────────────────────────────────────────────
  build-admin:
    name: 🐳 Build Admin Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context:  ./apps/admin
          file:     ./apps/admin/Dockerfile
          target:   production
          push:     true
          tags:     nityasamagri/admin:latest,nityasamagri/admin:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nityasamagri.com/api/v1
            NEXT_PUBLIC_WS_URL=wss://api.nityasamagri.com/ws
            NEXT_PUBLIC_APP_URL=https://admin.nityasamagri.com

  # ── Build Pandit Docker Image ─────────────────────────────────────────────────
  build-pandit:
    name: 🐳 Build Pandit Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Pandit
        uses: docker/build-push-action@v5
        with:
          context:  ./apps/pandit
          file:     ./apps/pandit/Dockerfile
          target:   production
          push:     true
          tags:     nityasamagri/pandit:latest,nityasamagri/pandit:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nityasamagri.com/api/v1
            NEXT_PUBLIC_WS_URL=wss://api.nityasamagri.com/ws
            NEXT_PUBLIC_APP_URL=https://pandit.nityasamagri.com

  # ── Deploy Both to Lightsail ──────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [build-admin, build-pandit]
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/nityasamagri
            git pull origin main

            # Pull new images
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           pull admin pandit

            # Restart admin + pandit
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           up -d --no-deps admin pandit

            sleep 10

            # Health checks
            curl -sf https://admin.nityasamagri.com  || exit 1
            curl -sf https://pandit.nityasamagri.com || exit 1

            docker image prune -f
            echo "✅ Admin and Pandit panels deployed!"