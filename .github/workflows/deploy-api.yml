name: 🚀 Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  REGISTRY:     docker.io
  IMAGE_NAME:   nityasamagri/api
  NODE_VERSION: "20"

jobs:
  # ── Lint & Type Check ─────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ── Test ──────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       nityasamagri_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:           postgresql://postgres:test_password@localhost:5432/nityasamagri
      REDIS_HOST:             localhost
      REDIS_PORT:             "6379"
      REDIS_PASSWORD:         ""
      JWT_SECRET:             test_jwt_secret_32_characters_long
      JWT_REFRESH_SECRET:     test_refresh_secret_32_characters
      JWT_EXPIRES_IN:         15m
      JWT_REFRESH_EXPIRES_IN: 30d
      NODE_ENV:               test
      RAZORPAY_KEY_ID:        rzp_test_dummy
      RAZORPAY_KEY_SECRET:    dummy_secret
      TWILIO_SID:             ACdummy
      TWILIO_TOKEN:           dummy
      TWILIO_PHONE:           "+10000000000"
      SENDGRID_API_KEY:       SG.dummy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test --if-present

  # ── Build & Push Docker Image ─────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          target:     production
          push:       true
          tags:       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to Lightsail ───────────────────────────────────────────────────────
  deploy:
    name: 🌍 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url:  https://api.nityasamagri.com/health

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          timeout:  120s
          script: |
            set -e
            cd ~/nityasamagri
            git pull origin main

            # Pull new API image
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           pull api

            # Restart API
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           up -d --no-deps api

            # Wait and health check
            sleep 15
            curl -sf https://api.nityasamagri.com/health || exit 1

            # Run migrations
            docker compose -f docker-compose.yml \
                           -f docker-compose.prod.yml \
                           exec -T api npx prisma migrate deploy

            # Cleanup
            docker image prune -f
            echo "✅ API deployed successfully!"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          SKIP_WEB:                "1"
          SKIP_ADMIN:              "1"
          SMOKE_TEST_RETRIES:      "6"
          SMOKE_TEST_RETRY_DELAY:  "8"

          