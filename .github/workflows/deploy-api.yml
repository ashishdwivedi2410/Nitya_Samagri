# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy-api.yml
# Triggers: push to main affecting backend/
# Steps: lint → type-check → test → build Docker → push → deploy EC2 → migrate
# ─────────────────────────────────────────────────────────────────────────────

name: 🚀 Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  REGISTRY:   docker.io
  IMAGE_NAME: khatumart/api
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Lint & Type Check ────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint || true   # non-blocking in early stages

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       khatumart_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:         postgresql://postgres:test_password@localhost:5432/khatumart_test
      REDIS_HOST:           localhost
      REDIS_PORT:           "6379"
      REDIS_PASSWORD:       ""
      JWT_SECRET:           test_jwt_secret_32_characters_long
      JWT_REFRESH_SECRET:   test_refresh_secret_32_characters
      JWT_EXPIRES_IN:       15m
      JWT_REFRESH_EXPIRES_IN: 30d
      NODE_ENV:             test
      RAZORPAY_KEY_ID:      rzp_test_dummy
      RAZORPAY_KEY_SECRET:  dummy_secret
      TWILIO_SID:           ACdummy
      TWILIO_TOKEN:         dummy
      TWILIO_PHONE:         "+10000000000"
      SENDGRID_API_KEY:     SG.dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations on test DB
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test --if-present

  # ── Job 3: Build & Push Docker Image ────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{date 'YYYY-MM-DD'}}-{{sha}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context:     ./backend
          file:        ./backend/Dockerfile
          target:      production
          push:        true
          tags:        ${{ steps.meta.outputs.tags }}
          labels:      ${{ steps.meta.outputs.labels }}
          cache-from:  type=gha
          cache-to:    type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}

      - name: Image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  # ── Job 4: Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    name: 🌍 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.thekhatumart.com/health

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     22
          timeout:  120s
          script: |
            set -e
            echo "🪔 Deploying KhatuMart API..."

            cd ~/khatumart

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Pull new Docker image
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api

            # Zero-downtime restart (rolling update)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --scale api=2 api

            # Wait for health check
            sleep 15
            curl -sf https://api.thekhatumart.com/health || exit 1

            # Run database migrations
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T api npx prisma migrate deploy

            # Scale back to 1 replica and remove old container
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --scale api=1 api

            # Cleanup old images
            docker image prune -f

            echo "✅ API deployment complete!"

      - name: Verify deployment
        run: |
          sleep 10
          response=$(curl -sf https://api.thekhatumart.com/health)
          echo "Health check: $response"
          echo "$response" | grep -q '"status":"ok"' || exit 1

      - name: Notify on success
        if: success()
        run: echo "✅ API deployed successfully at $(date)"

      - name: Notify on failure
        if: failure()
        run: echo "❌ API deployment failed at $(date)"
        