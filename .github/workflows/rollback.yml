name: ⏪ Manual Rollback

# On-demand rollback, independent of the scheduled deploy's automatic one.
# Use this if a bad version is discovered after the fact (e.g. hours after
# deploy, once the automatic post-deploy smoke test has already passed and
# recorded the bad version as "known good").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to roll back to (leave blank to use the previously deployed version)"
        required: false
        default: ""
      service:
        description: "Which service(s) to roll back"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - api
          - web
          - admin

jobs:
  rollback:
    name: ⏪ Rollback
    runs-on: ubuntu-latest
    environment:
      name: production
      url:  https://nityasamagri.in

    steps:
      - uses: actions/checkout@v4

      - name: Roll back via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          timeout:  180s
          envs:     INPUT_TAG,INPUT_SERVICE
          script: |
            set -e
            cd ~/Nitya_Samagri
            STATE_FILE=~/Nitya_Samagri/.deploy_state

            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              TAG=$(cat "$STATE_FILE.previous" 2>/dev/null || echo "")
            fi
            if [ -z "$TAG" ]; then
              echo "❌ No tag was given, and no previous version is on record."
              echo "❌ Pass the 'tag' input explicitly (check Docker Hub for available tags)."
              exit 1
            fi

            if [ "$INPUT_SERVICE" = "all" ]; then
              SERVICES="api web admin"
            else
              SERVICES="$INPUT_SERVICE"
            fi

            # Prod only runs blue/green pairs (api_blue/api_green, etc.) — there's
            # no bare "api"/"web"/"admin" service to target, so roll back whichever
            # color is currently live, in place (same pattern backend.yml/frontend.yml/
            # admin.yml use for their single-service deploys).
            ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
            echo "🔙 Rolling back [$SERVICES] (color: $ACTIVE) to tag: $TAG"

            for svc in $SERVICES; do
              docker pull docker.io/nityasamagri/$svc:$TAG
              docker tag  docker.io/nityasamagri/$svc:$TAG docker.io/nityasamagri/$svc:$ACTIVE
            done

            TARGETS=""
            for svc in $SERVICES; do TARGETS="$TARGETS ${svc}_$ACTIVE"; done

            docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
              up -d --no-deps $TARGETS

            sleep 20

            # Keep a record of what we rolled back *from*, and mark $TAG as
            # the new current state so the scheduled-deploy rollback path
            # stays consistent with reality.
            [ -f "$STATE_FILE" ] && cp "$STATE_FILE" "$STATE_FILE.rolled-back-from"
            echo "$TAG" > "$STATE_FILE"
            echo "✅ Rollback deploy complete."
        env:
          INPUT_TAG:     ${{ github.event.inputs.tag }}
          INPUT_SERVICE: ${{ github.event.inputs.service }}

      - name: Verify rollback with smoke test
        run: |
          chmod +x devops/scripts/smoke-test.sh
          ./devops/scripts/smoke-test.sh
        env:
          SMOKE_TEST_RETRIES:     "6"
          SMOKE_TEST_RETRY_DELAY: "8"