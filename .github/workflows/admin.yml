name: 🛠️ Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin.yml"

env:
  REGISTRY:     docker.io
  IMAGE_NAME:   nsadmin1/admin
  NODE_VERSION: "20"

jobs:
  # ── Build Admin Docker Image ──────────────────────────────────────────────────
  build-admin:
    name: 🐳 Build Admin Image
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context:  .
          file:     ./apps/admin/Dockerfile
          target:   production
          push:     true
          platforms: linux/arm64
          tags:     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.adminns.in/api/v1
            NEXT_PUBLIC_WS_URL=wss://api.adminns.in/ws
            NEXT_PUBLIC_APP_URL=https://adminns.in

  # ── Deploy Both to Lightsail ──────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Lightsail
    runs-on: ubuntu-24.04-arm
    needs: [build-admin]
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          envs:     NEW_TAG
          script: |
            set -e
            cd ~/Nitya_Samagri
            git pull origin main

            # Production only knows admin_blue / admin_green (see
            # docker-compose.prod.yml) — there's no bare "admin" service.
            # This workflow deploys just the admin app, so rather than doing
            # a full blue/green swap (which would also have to flip the
            # shared .active_color file that deploy-scheduled.yml uses to
            # keep api/web/admin in sync), it updates whichever color is
            # already live, in place — same pattern as deploy-web.yml.
            ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
            echo "Currently live color: $ACTIVE — updating admin_$ACTIVE in place."

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TAG
            docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TAG ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$ACTIVE

            docker compose -f devops/docker/docker-compose.dev.yml \
                           -f devops/docker/docker-compose.prod.yml \
                           up -d --no-deps admin_$ACTIVE

            # Health check — retry instead of a single shot right after `up -d`,
            # which raced the container's own startup. On final failure, isolate
            # whether it's the app, nginx→container routing, or DNS/SSL, instead
            # of failing with no evidence (same pattern as frontend.yml).
            HEALTHY=0
            for attempt in 1 2 3 4 5 6; do
              sleep 8
              if curl -sf --max-time 10 https://adminns.in > /dev/null; then
                echo "✅ Health check passed (attempt $attempt/6)."
                HEALTHY=1
                break
              fi
              echo "⏳ Health check attempt $attempt/6 failed, retrying..."
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Health check failed after 6 attempts (~48s) — deploy did not come up healthy."
              echo ""
              echo "── Diagnostics: container status ──"
              docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                ps admin_$ACTIVE

              echo ""
              echo "── Diagnostics: internal check (bypasses nginx/SSL/DNS) ──"
              if docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                   exec -T admin_$ACTIVE wget -qO- http://localhost:3000/ > /dev/null 2>&1; then
                echo "   ✅ App responds on :3000 inside its own container — the app is fine, this is an nginx-side routing problem."
                echo ""
                echo "── Diagnostics: nginx container status ──"
                docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                  ps nginx

                echo ""
                echo "── Diagnostics: can nginx itself reach admin_$ACTIVE over the docker network? ──"
                if docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                     exec -T nginx wget -qO- http://admin_$ACTIVE:3000/ > /dev/null 2>&1; then
                  echo "   ✅ nginx CAN reach admin_$ACTIVE directly — routing works at the network level, so this is proxy config/SSL, not DNS."
                else
                  echo "   ❌ nginx CANNOT reach admin_$ACTIVE at all — DNS/network problem between the nginx and admin_$ACTIVE containers, not a config issue."
                fi

                echo ""
                echo "── Diagnostics: active backend pointer nginx is actually using ──"
                docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                  exec -T nginx cat /etc/nginx/active/admin-backend.conf

                echo ""
                echo "── Diagnostics: last 50 log lines from nginx ──"
                docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                  logs --tail=50 nginx
              else
                echo "   ❌ App does NOT respond on :3000 inside its own container — the app itself is failing to boot."
                echo ""
                echo "── Diagnostics: last 100 log lines from admin_$ACTIVE ──"
                docker compose -f devops/docker/docker-compose.dev.yml -f devops/docker/docker-compose.prod.yml \
                  logs --tail=100 admin_$ACTIVE
              fi

              exit 1
            fi

            docker image prune -f
            echo "✅ Admin panel deployed (color: $ACTIVE)!"
        env:
          NEW_TAG: ${{ github.sha }}

      - name: Smoke test
        run: |
          chmod +x devops/scripts/smoke-test.sh
          ./devops/scripts/smoke-test.sh
        env:
          SKIP_API:                "1"
          SKIP_WEB:                "1"
          # Chatbot service isn't deployed yet — chat.nityasamagri.in doesn't
          # exist for the present. Remove this once it's live.
          SKIP_CHATBOT:            "1"
          SMOKE_TEST_RETRIES:      "6"
          SMOKE_TEST_RETRY_DELAY:  "8"