name: 🚀 Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  REGISTRY:     docker.io
  IMAGE_NAME:   nityasamagri/api
  NODE_VERSION: "20"

jobs:
  # ── Lint & Type Check ─────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  # ── Test ──────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI:               mongodb://localhost:27017/nityasamagri_test
      REDIS_HOST:              localhost
      REDIS_PORT:              "6379"
      REDIS_PASSWORD:          ""
      JWT_SECRET:              test_jwt_secret_32_characters_long
      JWT_REFRESH_SECRET:      test_refresh_secret_32_characters
      JWT_EXPIRES_IN:          15m
      JWT_REFRESH_EXPIRES_IN:  30d
      NODE_ENV:                test
      RAZORPAY_KEY_ID:         rzp_test_dummy
      RAZORPAY_KEY_SECRET:     dummy_secret
      TWILIO_SID:              ACdummy
      TWILIO_TOKEN:            dummy
      TWILIO_PHONE:            "+10000000000"
      GMAIL_USER:              noreply@example.com
      GMAIL_APP_PASSWORD:      dummy_app_password
      FIREBASE_PROJECT_ID:     test-project
      FIREBASE_CLIENT_EMAIL:   test@test-project.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY:    "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test --if-present

  # ── Build & Push Docker Image ─────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Monorepo build: package-lock.json lives at the repo root (npm
          # workspaces), not inside backend/, so context must be root — same
          # pattern as the admin/web build steps.
          context:    .
          file:       ./backend/Dockerfile
          target:     production
          push:       true
          tags:       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to Lightsail ───────────────────────────────────────────────────────
  deploy:
    name: 🌍 Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url:  https://api.adminns.in/health

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          timeout:  120s
          script: |
            set -e
            cd ~/Nitya_Samagri
            git pull origin main

            ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
            echo "Currently live color: $ACTIVE — updating api_$ACTIVE in place."

            # Pull new API image
            docker compose -f devops/docker/docker-compose.dev.yml \
                           -f devops/docker/docker-compose.prod.yml \
                           pull api_$ACTIVE

            # Restart API — migrations run automatically inside the
            # container's entrypoint (devops/docker/entrypoints/api-entrypoint.sh)
            # before the server starts, so no separate migrate step is needed here.
            docker compose -f devops/docker/docker-compose.dev.yml \
                           -f devops/docker/docker-compose.prod.yml \
                           up -d --no-deps api_$ACTIVE

            # Wait and health check
            sleep 15
            curl -sf https://api.adminns.in/health || exit 1

            # Cleanup
            docker image prune -f
            echo "✅ API deployed successfully!"

      - name: Smoke test
        run: |
          chmod +x devops/scripts/smoke-test.sh
          ./devops/scripts/smoke-test.sh
        env:
          SKIP_WEB:                "1"
          SKIP_ADMIN:              "1"
          SMOKE_TEST_RETRIES:      "6"
          SMOKE_TEST_RETRY_DELAY:  "8"