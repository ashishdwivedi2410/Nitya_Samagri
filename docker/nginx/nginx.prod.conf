# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.prod.conf — Production Nginx with SSL + reverse proxy (blue/green)
#
# api_backend / web_backend / admin_backend are NOT static nginx upstream
# blocks — they're variables, set by the tiny include files under
# docker/nginx/active/*.conf, so which color (blue/green) receives traffic
# can be switched with a file copy + `nginx -s reload`, no config edit here.
#
# Trade-off: because proxy_pass targets a variable instead of a static
# upstream{} block, nginx resolves it per-request via the `resolver` below
# instead of using a pooled upstream — we lose keepalive connection reuse to
# these three backends in exchange for instant, zero-downtime color
# switching. That's the right trade for this project's traffic level.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Docker's embedded DNS — needed to resolve container names (api_blue,
  # api_green, ...) at request time since we're using variables in proxy_pass.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time"';

  access_log /var/log/nginx/access.log main;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length    1000;

  # ── Security headers ───────────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"  always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header X-Content-Type-Options    "nosniff"     always;
  add_header Referrer-Policy           "no-referrer-when-downgrade" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  server_tokens off;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;
  limit_req_zone $binary_remote_addr zone=general:10m  rate=60r/m;

  # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name nityasamagri.com www.nityasamagri.com admin.nityasamagri.com;
    return 301 https://$host$request_uri;
  }

  # ── Customer storefront — nityasamagri.com ─────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name nityasamagri.com www.nityasamagri.com;

    # Sets $web_backend to "web_blue:3000" or "web_green:3000" — see
    # docker/nginx/active/README.md
    include /etc/nginx/active/web-backend.conf;

    ssl_certificate     /etc/letsencrypt/live/nityasamagri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nityasamagri.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10M;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
      proxy_pass http://$web_backend;
      proxy_cache_valid 200 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Next.js app
    location / {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://$web_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── Admin panel — admin.nityasamagri.com ───────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name admin.nityasamagri.com;

    # Sets $admin_backend to "admin_blue:3000" or "admin_green:3000"
    include /etc/nginx/active/admin-backend.conf;

    ssl_certificate     /etc/letsencrypt/live/nityasamagri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nityasamagri.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Restrict to office IPs (add your IPs below)
    # allow 203.0.113.0/24;
    # deny all;

    location / {
      proxy_pass http://$admin_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── API — api.nityasamagri.com ─────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.nityasamagri.com;

    # Sets $api_backend to "api_blue:4000" or "api_green:4000"
    include /etc/nginx/active/api-backend.conf;

    ssl_certificate     /etc/letsencrypt/live/nityasamagri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nityasamagri.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    # Auth endpoints — strict rate limit
    location ~ ^/api/v1/auth/(login|register|otp) {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://$api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Razorpay webhook — no rate limit, raw body
    location /api/v1/payments/webhook {
      proxy_pass http://$api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # WebSocket upgrade
    location /ws {
      proxy_pass http://$api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # General API
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://$api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Health check
    location /health {
      proxy_pass http://$api_backend;
      access_log off;
    }
  }
}